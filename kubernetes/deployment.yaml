apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-simulator
  namespace: data-center-monitoring
  labels:
    app: telemetry-simulator
    app.kubernetes.io/part-of: data-center-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-simulator
  template:
    metadata:
      labels:
        app: telemetry-simulator
    spec:
      containers:
        - name: telemetry-simulator
          image: data-center-monitoring/telemetry-simulator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: telemetry-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
